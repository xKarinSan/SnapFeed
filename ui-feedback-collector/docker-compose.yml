version: '3.8'

services:
  feedback-collector:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - feedback-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/feedback.db
    restart: unless-stopped

volumes:
  feedback-data:
